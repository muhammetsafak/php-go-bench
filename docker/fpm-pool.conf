[www]
; Static pool of 32: the same number of PHP processes, and therefore database
; connections (persistent PDO, one per worker), as the FrankenPHP worker count
; and the Go pool size.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096
user = www-data
group = www-data
pm = static
pm.max_children = 32
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

[www]
; Static pool. fpm-entrypoint.sh substitutes __WORKERS__ (default 32): the
; number of PHP processes and therefore of database connections (persistent
; PDO, one per worker), the same knob as the FrankenPHP worker count and the
; Go pool size.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096
user = www-data
group = www-data
pm = static
pm.max_children = __WORKERS__
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

worker_processes 4;
error_log /dev/stderr warn;
events { worker_connections 8192; multi_accept on; }
http {
  access_log off;
  tcp_nodelay on;
  keepalive_timeout 75;
  keepalive_requests 1000000;
  server {
    listen 80 default_server;
    location / {
      default_type application/json;
      return 200 '{"probe":true}';
    }
  }
}

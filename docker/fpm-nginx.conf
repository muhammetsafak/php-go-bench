# nginx in front of php-fpm, inside the candidate's own core budget — however
# many cores that budget is. fpm-entrypoint.sh substitutes __NGINX_WORKERS__
# (default 2).
# No try_files, no static files: every request goes straight to index.php.
#
# No upstream keepalive / fastcgi_keep_conn. With keep_conn a php-fpm child
# stays bound to one nginx connection; two nginx workers can cache more idle
# connections than the pool has children, and requests arriving on the other
# worker then wait in the socket backlog until nginx gives up (504). The
# smoke run of 2026-09-16 showed exactly that. A fresh unix-socket connection
# per request is the stock Debian/Ubuntu setup and costs microseconds.
user www-data;
worker_processes __NGINX_WORKERS__;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 8192; multi_accept on; }

http {
  access_log off;
  tcp_nodelay on;
  keepalive_timeout 75;
  keepalive_requests 1000000;
  server_tokens off;
  default_type application/octet-stream;


  server {
    listen 80 default_server;
    client_max_body_size 64k;

    location / {
      include /etc/nginx/fastcgi_params;
      fastcgi_pass unix:/run/php-fpm.sock;
      fastcgi_param SCRIPT_FILENAME /app/public/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param DOCUMENT_ROOT /app/public;
      fastcgi_buffers 16 16k;
      fastcgi_buffer_size 32k;
      fastcgi_read_timeout 60s;
    }
  }
}

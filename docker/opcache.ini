; Production opcache, identical for both PHP candidates.
; JIT stays off (buffer 0): it is not part of the default production setup of
; either runtime, and turning it on would add a second variable.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.jit_buffer_size=0
